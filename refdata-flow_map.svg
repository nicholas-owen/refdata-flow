</text>
<text x="290.0" y="995.0" font-size="13" font-weight="500" text-anchor="start" fill="#868e96" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<tspan x="290.0" dy="0">Orchestration line — run_pipeline.sh chains resolve.py → Nextflow download → update_refgenie.</tspan>
</text>
<text x="290.0" y="1012.0" font-size="13" font-weight="500" text-anchor="start" fill="#868e96" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<tspan x="290.0" dy="0">--dry-run stops after resolution · -resume skips completed downloads · --clean purges the work/ cache.</tspan>
</text>
