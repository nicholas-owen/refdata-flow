name: smoke-test

# Fast sanity check on every push / PR. It does NOT download genomes: it runs the
# pipeline wrapper in --dry-run mode, which builds the pinned venv, runs the
# resolver, and prints what *would* be downloaded, then exits before Nextflow.
# This catches gross breakage (shell syntax, Python errors, CSV parsing, a broken
# or unpinnable dependency set) in seconds.
#
# The test suite then runs in the same job: the resolver, the ingest against real
# refgenie, and main.nf itself under `nextflow run -stub`. Still no downloads.

on:
  push:
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python 3.10 matches the version requirements.txt was locked against,
      # so the hash-checked install resolves deterministically.
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Static checks (shell syntax + Python compile)
        run: |
          bash -n run_pipeline.sh
          python -m py_compile bin/*.py

      # Pre-seed the resolver cache so CI needs no network and never hits the
      # interactive prompt (an ambiguous query would block on stdin under CI).
      - name: Seed resolver cache
        run: |
          mkdir -p requests
          cp examples/sample_requests_resolved.csv requests/requests_resolved.csv

      - name: Dry-run smoke test
        run: bash run_pipeline.sh examples/sample_requests_raw.csv --dry-run

      - name: Assert resolved output
        run: |
          test -f requests/requests_resolved.csv
          grep -q "sacCer3" requests/requests_resolved.csv
          echo "Smoke test passed."

      # tests/test_nextflow_stub.py executes main.nf (`nextflow run -stub`, plus
      # the retry tests). Same pinned version as the lint job below; the action
      # installs Java 17 itself.
      - name: Set up Nextflow (installs Java 17)
        uses: nf-core/setup-nextflow@v3
        with:
          version: "26.04.4"

      # The RealDerivation tests run the transcriptome derivation with the real
      # tool. The pipeline itself takes gffread from bioconda, pinned to 0.12.7;
      # here the distribution's package is enough to exercise the same command.
      - name: Install gffread
        run: |
          sudo apt-get update
          sudo apt-get install -y gffread

      # tests/test_derive.py runs the derived-asset scripts with the real tools.
      # bgzip and tabix come from the distribution. The four UCSC tools are not
      # packaged for Ubuntu, so their static binaries are taken from UCSC's own
      # download server; the pipeline itself takes them from bioconda.
      - name: Install the tools for the derived assets
        run: |
          sudo apt-get install -y tabix
          for tool in gtfToGenePred genePredToBed faToTwoBit twoBitInfo; do
            sudo curl -fsSL -o "/usr/local/bin/$tool" \
              "https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64/$tool"
            sudo chmod +x "/usr/local/bin/$tool"
          done

      # Runs after the dry run on purpose: that step is what builds .venv and
      # writes the samtools shim the ingest tests need. No genome provider is
      # contacted - the resolver tests fake the provider search, the Nextflow
      # tests run the stub block, and the ingest tests build a refgenie vault from
      # toy genomes a few dozen bases long.
      #
      # The tests skip themselves when refgenie, samtools, nextflow, gffread or a
      # derive tool is missing, which is right on a laptop and wrong here: this job
      # installs all of them, so a skip means the setup above broke and the suite
      # proved nothing.
      - name: Unit, ingest and Nextflow tests
        run: |
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -Eq "skipped=[1-9]" "$RUNNER_TEMP/tests.log"; then
            echo "::error::Some tests were skipped; CI must run all of them."
            exit 1
          fi

  # Static parse/lint of the Nextflow code with the strict syntax parser - the
  # same parser users run, so this catches errors like a local closure being
  # reported as "not defined" before they reach anyone. No execution, no conda,
  # no network: `nextflow lint` is pure static analysis.
  nextflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-nextflow@v3 is the Node 24 release and installs Java 17 itself,
      # so no separate setup-java step is needed.
      - name: Set up Nextflow (installs Java 17)
        uses: nf-core/setup-nextflow@v3
        with:
          version: "26.04.4"

      # The strict syntax parser is the default from Nextflow 26.04 onward, so
      # no NXF_SYNTAX_PARSER override is needed - `nextflow lint` uses it directly.
      - name: Lint Nextflow scripts (strict parser)
        run: nextflow lint main.nf nextflow.config
